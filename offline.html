<!doctype html>

<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Hors ligne — Studio Chatoyant</title>
    <meta
      name="description"
      content="Cette page de Studio Chatoyant n'est pas disponible hors ligne."
    />
    <meta name="theme-color" content="#27272a" />
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="favicon.png" />
    <link rel="manifest" href="manifest.json" />
    <style type="text/tailwindcss">
      @theme {
        /* Typographies */
        --font-fraunces: "Fraunces", serif;
        --font-poppins: "Poppins", sans-serif;
      }
    </style>
  </head>

  <body>
    <main id="contenuPrincipal">
      <section
        id="horsLigne"
        class="mx-auto grid min-h-screen max-w-7xl grid-cols-12 content-center px-12 py-16"
      >
        <div class="col-span-12 text-center md:col-start-3 md:col-span-8">
          <!-- Icône décorative : le titre porte déjà l'information -->
          <svg
            class="mx-auto h-16 w-16 text-zinc-400"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M1 1l22 22" />
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
            <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
            <line x1="12" y1="20" x2="12.01" y2="20" />
          </svg>

          <h1 class="mt-6 font-fraunces text-3xl font-[700] md:text-4xl">
            Vous êtes hors ligne
          </h1>

          <p
            class="mx-auto mt-4 max-w-prose font-poppins leading-relaxed text-zinc-700"
          >
            Cette page n'a pas encore été enregistrée sur votre appareil.
            Rétablissez la connexion, ou retournez à une page déjà visitée.
          </p>

          <div
            class="mt-10 flex flex-col items-center justify-center gap-3 sm:flex-row"
          >
            <a
              href="index.html"
              class="bouton bouton--chatoyant inline-flex items-center gap-2 rounded-full bg-zinc-900 px-6 py-3 font-poppins font-semibold text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-zinc-900"
            >
              Retour à l'accueil
              <span class="bouton__fleche" aria-hidden="true">&#8594;</span>
            </a>

            <button
              type="button"
              id="boutonReessayer"
              class="inline-flex items-center gap-2 rounded-full border-2 border-zinc-300 px-6 py-3 font-poppins font-semibold text-zinc-900 transition-colors hover:bg-zinc-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-zinc-900"
            >
              Réessayer
            </button>
          </div>
        </div>
      </section>
    </main>

    <script>
      document
        .getElementById("boutonReessayer")
        .addEventListener("click", () => {
          window.location.reload();
        });
    </script>
  </body>
</html>
