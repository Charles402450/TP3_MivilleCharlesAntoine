<!doctype html>

<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Studio Chatoyant</title>
    <meta
      name="description"
      content="Studio Chatoyant - Studio de jeux vidéo québécois."
    />
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="favicon.png" />
    <script src="js/navigation.js" defer></script>
    <style type="text/tailwindcss">
      @theme {
        /* Typographies */
        --font-fugaz: "Fugaz One", sans-serif;
        --font-inter: "Inter", sans-serif;
      }
    </style>
  </head>

  <body>
    <!-- Lien d'évitement : invisible sauf au clavier (Tab au chargement) -->
    <a
      href="#contenuPrincipal"
      class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-50 focus:rounded-md focus:bg-white focus:px-4 focus:py-2 focus:font-semibold focus:text-zinc-900"
    >
      Aller au contenu principal
    </a>

    <header class="nav relative bg-zinc-900 text-zinc-100 shadow-md">
      <div class="mx-auto max-w-7xl px-4 sm:px-6">
        <div class="grid grid-cols-12 items-center gap-4 py-3">
          <!-- ---------- Logo (gauche) ---------- -->
          <div class="col-span-8 md:col-span-4 lg:col-span-3">
            <a
              href="index.html"
              class="nav__logo inline-flex items-center gap-2 rounded focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-white"
            >
              <!-- alt="" : le logo est décoratif, le nom est déjà écrit à côté -->
              <img
                src="media/logo250x250.png"
                alt=""
                width="36"
                height="36"
                class="h-9 w-9"
              />
              <span class="font-fugaz text-lg tracking-wide"
                >Studio Chatoyant</span
              >
            </a>
          </div>

          <!-- ---------- Zone droite : burger + navigation ---------- -->
          <div class="col-span-4 flex justify-end md:col-span-8 lg:col-span-9">
            <!-- Bouton burger : visible sous md uniquement -->
            <button
              type="button"
              id="navBurger"
              class="nav__burger inline-flex items-center justify-center rounded-md p-2 text-zinc-100 transition-colors hover:bg-zinc-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white md:hidden"
              aria-expanded="false"
              aria-controls="navPrincipale"
              aria-label="Ouvrir le menu de navigation"
            >
              <!-- Icône burger -->
              <svg
                id="navIconeBurger"
                class="h-6 w-6"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <line x1="4" y1="7" x2="20" y2="7" />
                <line x1="4" y1="12" x2="20" y2="12" />
                <line x1="4" y1="17" x2="20" y2="17" />
              </svg>

              <!-- Icône fermeture (masquée par défaut) -->
              <svg
                id="navIconeFermer"
                class="hidden h-6 w-6"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <line x1="6" y1="6" x2="18" y2="18" />
                <line x1="18" y1="6" x2="6" y2="18" />
              </svg>
            </button>

            <!--
              Un seul <nav> pour les deux affichages :
              - sous md : panneau absolu sous le header (masqué par « hidden »)
              - à partir de md : barre horizontale en flux normal (« md:static »
                annule le positionnement absolu, et « md:block » l'emporte sur
                « hidden » puisque les variantes viennent après en CSS)
            -->
            <nav
              id="navPrincipale"
              class="nav__menu absolute left-0 right-0 top-full z-40 hidden border-t border-zinc-800 bg-zinc-900 px-4 py-4 md:static md:block md:border-0 md:bg-transparent md:p-0"
              aria-label="Navigation principale"
            >
              <ul
                class="nav__liste flex flex-col gap-1 md:flex-row md:items-center md:gap-1"
              >
                <!-- À propos -->
                <li class="nav__item">
                  <a
                    href="apropos.html"
                    class="nav__lien block rounded-md px-3 py-2 font-inter transition-colors hover:bg-zinc-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white aria-[current=page]:bg-zinc-800 aria-[current=page]:font-semibold"
                  >
                    À propos
                  </a>
                </li>

                <li class="nav__item relative">
                  <div class="flex items-stretch md:block">
                    <!-- Le lien occupe toute la largeur restante sur mobile -->
                    <a
                      href="jeux.html"
                      class="nav__lien flex-1 rounded-l-md px-3 py-2 font-inter transition-colors hover:bg-zinc-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white aria-[current=page]:bg-zinc-800 aria-[current=page]:font-semibold md:block md:rounded-md"
                    >
                      Jeux
                    </a>

                    <!--
                      Chevron : mobile seulement. Sur bureau, le sous-menu
                      s'ouvre au survol et à l'arrivée du focus clavier.
                    -->
                    <button
                      type="button"
                      class="nav__bascule flex items-center rounded-r-md px-4 transition-colors hover:bg-zinc-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white md:hidden"
                      aria-expanded="false"
                      aria-controls="sousMenuJeux"
                    >
                      <span class="sr-only">Afficher les jeux</span>
                      <svg
                        class="nav__chevron h-5 w-5 transition-transform duration-200"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                      >
                        <polyline points="6 9 12 15 18 9" />
                      </svg>
                    </button>
                  </div>

                  <ul
                    id="sousMenuJeux"
                    class="nav__sousMenu pl-4 md:absolute md:left-0 md:top-full md:z-50 md:min-w-60 md:rounded-md md:border md:border-zinc-800 md:bg-zinc-900 md:py-2 md:pl-0 md:shadow-lg"
                  >
                    <li>
                      <a
                        href="moogicalsanctuary.html"
                        class="nav__lien nav__lien--sousMenu block rounded-md px-3 py-2 font-inter text-sm transition-colors hover:bg-zinc-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white aria-[current=page]:bg-zinc-800 aria-[current=page]:font-semibold md:rounded-none"
                      >
                        Moogical Sanctuary
                      </a>
                    </li>
                  </ul>
                </li>

                <!-- Contact -->
                <li class="nav__item">
                  <a
                    href="contact.html"
                    class="nav__lien block rounded-md px-3 py-2 font-inter transition-colors hover:bg-zinc-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white aria-[current=page]:bg-zinc-800 aria-[current=page]:font-semibold"
                  >
                    Contact
                  </a>
                </li>
              </ul>
            </nav>
          </div>
        </div>
      </div>
    </header>

    <main id="contenuPrincipal">
      <section class="grid grid-cols-12 mx-auto max-w-7xl">
        <div class=""></div>
      </section>
    </main>

    <footer class="">
      <div class=""></div>
    </footer>
  </body>
</html>
