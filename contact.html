<!doctype html>

<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Studio Chatoyant</title>
    <meta
      name="description"
      content="Studio Chatoyant - Studio de jeux vidéo québécois."
    />
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="favicon.png" />
    <style type="text/tailwindcss">
      @theme {
        /* Typographies */
        --font-fugaz: "Fugaz One", sans-serif;
        --font-inter: "Inter", sans-serif;
      }
    </style>
  </head>

  <body>
    <header></header>
    <main>
      <section id="" class="grid grid-cols-12 mx-auto max-w-7xl">
        <div class=""></div>
      </section>
      <section id="formInfolettre">
        <form
          id="formInfolettre"
          action="confirmation.html"
          method="post"
          novalidate
        >
          <fieldset>
            <legend>Informations personnelles</legend>
            <div class="form">
              <div class="inputControl form--width">
                <label for="prenom">Prénom<span>*</span></label>
                <input type="text" id="prenom" />
                <div class="errorMessage"></div>
              </div>
              <div class="inputControl form--width">
                <label for="nom">Nom de famille<span>*</span></label>
                <input type="text" id="nom" />
                <div class="errorMessage"></div>
              </div>
              <div class="inputControl form--width">
                <label for="courriel">Adresse courriel<span>*</span></label>
                <input type="email" id="courriel" />
                <div class="errorMessage"></div>
              </div>
              <div class="inputControl form--width">
                <label for="naissance">Date de naissance<span>*</span></label>
                <input type="date" id="naissance" />
                <div class="errorMessage"></div>
              </div>
              </fieldset>
              <fieldset>
            <legend>Autres informations</legend>
              <div class="inputControl form--width">
                <label for="premier-contact"
                  >Où avez-vous entendu parler de nous?<span>*</span></label
                >
                <select id="premier-contact">
                  <option value="">Sélectionnez une option</option>
                  <option value="recommandation">
                    Recommandation d'un ami
                  </option>
                  <option value="publicite">Publicité</option>
                  <option value="medias-sociaux">Médias sociaux</option>
                  <option value="autre">Autre</option>
                </select>
                <div class="errorMessage"></div>
              </div>
              <div class="inputControl form--width">
                <label for="langue-infolettre"
                  >Langue de l'infolettre<span>*</span></label
                >
                <select id="langue-infolettre">
                  <option value="">Sélectionnez une option</option>
                  <option value="FR">Français</option>
                  <option value="EN">Anglais</option>
                </select>
                <div class="errorMessage"></div>
              </div></fieldset>
              <fieldset name="contenu-preference" id="contenu-preference">
                <legend>J'accepte de recevoir des communications...</legend>
                <div class="form__champRadio--flex">
                  <input
                    type="radio"
                    name="contenu-preference"
                    id="moogical-sanctuary"
                    value="Moogical Sanctuary"
                  />
                  <label
                    class="form__champRadio--margin"
                    for="moogical-sanctuary"
                    >Sur le jeu « Moogical Sanctuary »</label
                  >
                </div>
                <div class="form__champRadio--flex">
                  <input
                    type="radio"
                    name="contenu-preference"
                    id="moogical-sanctuary"
                    value="Moogical Sanctuary"
                  />
                  <label
                    class="form__champRadio--margin"
                    for="moogical-sanctuary"
                    >Sur tous les jeux à venir</label
                  >
                </div>
                <div class="errorMessage"></div>
              </fieldset>

              <div class="inputControl form--width form__checkbox--flex">
                <input type="checkbox" id="conditions-utilisation" />
                <label
                  class="form__checkboxLabel--margin"
                  for="conditions-utilisation"
                >
                  J'accepte les conditions d'utilisation<span>*</span><br /><a
                    href="https://www.google.com/"
                    >Lire les conditions d'utilisation</a
                  >
                </label>
                <div class="errorMessage"></div>
              </div>
              <div class="inputControl form--width form__checkbox--flex">
                <input type="checkbox" id="nouveautes-offres-courriel" />
                <label
                  class="form__checkboxLabel--margin"
                  for="nouveautes-offres-courriel"
                >
                  Je souhaite recevoir les nouveautés et offres par courriel
                </label>
              </div>
              <button type="submit">M'inscrire à l'infolettre</button>
            </div>
          </fieldset>
        </form>
      </section>
    </main>

    <footer class="">
      <div class=""></div>
    </footer>
  </body>
</html>
